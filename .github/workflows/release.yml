name: Release

on:
  push:
    tags: ["v*"]

jobs:
  npm:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 20 ships npm 10.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

      - name: Check the tag matches package.json
        run: |
          version=${GITHUB_REF_NAME#v}
          pkg=$(node -p "require('./package.json').version")
          test "$version" = "$pkg" || { echo "tag $version != package.json $pkg"; exit 1; }

      # Preferred: configure a Trusted Publisher for this repo + release.yml on npmjs.com and set no
      # secret at all. npm exchanges the workflow's OIDC token for a short-lived credential.
      - name: Publish with trusted publishing (no stored token)
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: npm publish --provenance --access public

      # Fallback: a granular access token with "Bypass two-factor authentication" saved as NPM_TOKEN.
      - name: Publish with NPM_TOKEN
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
